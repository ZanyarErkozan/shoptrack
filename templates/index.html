<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>{{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>{{ app_name }}</h1>
        <p class="tag">store sales · stock · revenue</p>
      </div>
    </div>
    <p class="lan-hint" id="lanHint"></p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="dash" type="button">Overview</button>
    <button class="tab" data-tab="products" type="button">Products</button>
    <button class="tab" data-tab="sales" type="button">Sales</button>
  </nav>

  <main>
    <section id="panel-dash" class="panel active">
      <div class="metrics" id="metrics"></div>
      <div class="split">
        <div class="block">
          <h2>Top sellers</h2>
          <div id="topProducts" class="list"></div>
        </div>
        <div class="block">
          <h2>Low stock</h2>
          <div id="lowStock" class="list"></div>
        </div>
      </div>
      <div class="block">
        <h2>Recent sales</h2>
        <div id="recentSales" class="list"></div>
      </div>
    </section>

    <section id="panel-products" class="panel">
      <div class="block form-block">
        <h2 id="productFormTitle">Add product</h2>
        <form id="productForm" class="form-grid">
          <input type="hidden" id="productId" />
          <label>Name<input name="name" id="pName" required placeholder="Classic Tee — Black" /></label>
          <label>SKU<input name="sku" id="pSku" required placeholder="TEE-BLK-M" /></label>
          <label>Category<input name="category" id="pCategory" value="T-Shirts" /></label>
          <label>Size<input name="size" id="pSize" placeholder="M" /></label>
          <label>Color<input name="color" id="pColor" placeholder="Black" /></label>
          <label>Sale price ({{ currency }})<input name="unit_price" id="pPrice" type="number" step="0.01" min="0" required /></label>
          <label>Cost ({{ currency }})<input name="cost_price" id="pCost" type="number" step="0.01" min="0" value="0" /></label>
          <label>Stock qty<input name="stock_qty" id="pStock" type="number" min="0" value="0" /></label>
          <label>Low-stock alert<input name="low_stock_at" id="pLow" type="number" min="0" value="5" /></label>
          <div class="form-actions">
            <button type="submit" class="btn primary" id="productSubmit">Save product</button>
            <button type="button" class="btn ghost" id="productCancel" hidden>Cancel edit</button>
          </div>
        </form>
      </div>
      <div class="block">
        <div class="block-head">
          <h2>Catalog</h2>
          <input id="productSearch" class="search" placeholder="Search name or SKU" />
        </div>
        <div id="productList" class="list"></div>
      </div>
    </section>

    <section id="panel-sales" class="panel">
      <div class="block form-block">
        <h2>Record a sale</h2>
        <form id="saleForm" class="form-grid sale-form">
          <label class="span-2">Product
            <select id="sProduct" required></select>
          </label>
          <label>Quantity<input id="sQty" type="number" min="1" value="1" required /></label>
          <label>Note<input id="sNote" placeholder="optional" /></label>
          <div class="form-actions span-2">
            <button type="submit" class="btn primary">Save sale</button>
          </div>
        </form>
      </div>
      <div class="block">
        <h2>Sales history</h2>
        <div id="salesList" class="list"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script>
    window.SHOPTRACK = { currency: {{ currency|tojson }} };
  </script>
  <script src="/static/js/app.js"></script>
</body>
</html>
